<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Dominion</title>
    <meta name="description" content="Nebula Dominion: RTS spaziale 2D. Estrai minerali, conquista pianeti, distruggi la Nave Madre nemica." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060f'/%3E%3Cpath d='M28 16 L6 27 L10 16 L6 5 Z' fill='%23123' stroke='%234fc3f7' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05060f; }
      #app { width: 100vw; height: 100vh; }
      canvas { display: block; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; color: #8fa6d6; font: 500 18px Rajdhani, system-ui, sans-serif; text-align: center; padding: 16px;
      }
      #boot strong { color: #e8f4ff; font: 800 28px Orbitron, system-ui, sans-serif; letter-spacing: 2px; }
      #boot a { color: #4fc3f7; }
      #boot .slow { display: none; max-width: 520px; color: #ff8a80; }
      #boot.late .slow { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- visibile finché il gioco non parte: se resta, lo script non è stato caricato -->
    <div id="boot">
      <strong>NEBULA DOMINION</strong>
      <span>Caricamento…</span>
      <noscript>Per giocare serve JavaScript attivo nel browser.</noscript>
      <p class="slow">
        Il gioco non si è avviato. Ricarica la pagina; se il problema resta, apri la console del browser (F12) e
        segnala l'errore su <a href="https://github.com/YNGING/nebula-dominion/issues">GitHub</a>.
      </p>
    </div>
    <script>
      setTimeout(function () {
        var b = document.getElementById('boot');
        if (b) b.className = 'late';
      }, 8000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
